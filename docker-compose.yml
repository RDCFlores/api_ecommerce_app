services:
  app:
    image: php:8.3-apache
    container_name: api_ecommerce_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecommerce_db
      - DB_USERNAME=ecommerce_user
      - DB_PASSWORD=secret
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
    entrypoint: >
      bash -c "
      apt-get update && apt-get install -y libpq-dev zip unzip git libzip-dev &&
      docker-php-ext-install pdo pdo_mysql zip &&
      sed -ri -e 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf &&
      a2enmod rewrite &&
      apache2-foreground
      "
    depends_on:
      - db
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php-fpm"

  db:
    image: mysql:8.0
    container_name: mysql_ecommerce
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - ecommerce_db_data:/var/lib/mysql

volumes:
  ecommerce_db_data:
